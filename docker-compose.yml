version: '3.8'

services:
  haha:
    image: postgres:15
    container_name: postgres-db-new
    restart: always
    environment:
      POSTGRES_USER: nghi
      POSTGRES_PASSWORD: PasswordProkVIp2@43
      POSTGRES_DB: carenest_authoie_service
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my-network
  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  pgdata: