version: '3.8'

services:
  # Spring Boot Application - Auth Service
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # PostgreSQL External qua Tailscale
      - SPRING_DATASOURCE_URL=jdbc:postgresql://100.93.191.32:5432/carenest_authoie_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=HoiLamChi123@
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      
      # Redis trong network
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      carenest-network:
        ipv4_address: 192.168.0.12
    volumes:
      - app-logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      carenest-network:
        ipv4_address: 192.168.0.13
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  carenest-network:
    external: true

volumes:
  app-logs:
    driver: local
  redis-data:
    driver: local